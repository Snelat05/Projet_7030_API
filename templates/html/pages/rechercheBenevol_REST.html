{% extends "html/base/backend.html" %}

{% block content %}

     <div class="container my-5">
    <h1 class="mb-4 text-center">Recherche de Bénévoles</h1>

    <form id="searchForm" class="mb-4">
      <div class="row g-3">
        <div class="col-md-5">
          <input type="text" id="nom" name="nom" class="form-control" placeholder="Nom">
        </div>
        <div class="col-md-5">
          <input type="text" id="prenom" name="prenom" class="form-control" placeholder="Prénom">
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Rechercher</button>
        </div>
      </div>
    </form>

{#         <div id="loading" class="text-center my-5" style="display: none;">#}
{#            <div class="spinner-border text-primary" role="status">#}
{#                <span class="visually-hidden">Chargement...</span>#}
{#            </div>#}
{#        </div>#}

    <div class="table-responsive">
      <table class="table table-bordered table-hover" id="resultsTable">
        <thead class="table-dark">
          <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Sexe</th>
            <th>Email</th>
            <th>Adresse</th>
            <th>Motivation</th>
          </tr>
        </thead>
        <tbody id="benevolRow">

        </tbody>
      </table>
    </div>
     <nav aria-label="Pagination" class="mt-4">
                <ul class="pagination justify-content-center pagination-lg" id="pagination"></ul>
            </nav>
  </div>

{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='bootstrap/script.js') }}"></script>
{% endblock %}
