<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Connexion Administrateur</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/back.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<div class="login-container">
    <h2>Connexion Administrateur</h2>

    <div class="error">
        {% if erreur %}
            <span> {{ erreur }} </span>
        {% endif %}
    </div>

    <form method="POST" action="{{ url_for('admin') }}">
        <div class="mb-3">
            <label for="email" class="form-label">Email <span class="required">*</span></label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Entrez votre e-mail" required
                   value="{{ email }}">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe <span class="required">*</span></label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Entrez votre mot de passe" required value="{{ password }}">
        </div>
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
    <p class="form-text">
        <a href="{{ url_for('reset') }}">Mot de passe oublié ?</a><br>
        <a href="{{ url_for ('index') }}">&#x21B5; Retour sur le site </a>
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
