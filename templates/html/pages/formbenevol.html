{% extends "html/base/corps.html" %}

{% block content %}

    <div class="container my-4">
        <div class="row">
            <div class="col-12 image-container text-center">
                <img src="{{ url_for('static', filename='Images/5.png') }}" class="img-thumbnail" alt="...">
            </div>
        </div>

        <div class="row">
            <div class="col-12 form-container">

                <div class="error">
                    {% if erreur %}
                        <span> {{ erreur }} </span>
                    {% endif %}
                </div>

                <form method="POST" action="{{ url_for('formbenevol') }}">
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom <span class="required">*</span></label>
                        <input type="text" id="nom" name="nom" placeholder="NOM" size="40" class="form-control"
                               value="{{ nom }}">
                    </div>

                    <div class="mb-3">
                        <label for="prenom" class="form-label">Prénom <span class="required">*</span></label>
                        <input type="text" id="prenom" name="prenom" placeholder="PRENOM" size="40" class="form-control"
                               value="{{ prenom }}">
                    </div>

                    <div class="mb-3">
                        <label for="champ-select" class="form-label">Sexe</label>
                        <select name="sexe" id="sexe" class="form-control">
                            <option value="masculin">Masculin</option>
                            <option value="féminin">Féminin</option>
                            <option value="autre">Autres</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="EMAIL" size="40" class="form-control"
                               value="{{ email }}">
                    </div>

                    <div class="mb-3">
                        <label for="adresse" class="form-label">Adresse <span class="required">*</span></label>
                        <input type="text" id="adresse" name="adresse" placeholder="ADRESSE" size="40"
                               class="form-control" value="{{ adresse }}">
                    </div>

                    <div class="mb-3">
                        <label for="message"></label>
                        <textarea id="message" name="motivation" rows="4" cols="50" placeholder="Motivation"
                        ></textarea>
                    </div>


                    <div class="d-grid gap-2 col-6 mx-auto">
                        <input class="btn btn-primary" type="submit" value="SOUMETTRE">
                    </div>
                </form>

            </div>
        </div>
    </div>


{% endblock %}
